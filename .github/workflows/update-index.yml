name: Update blog index

on:
  push:
    paths:
      - "blog/*.html"
      - "generate_index.py"
      - ".github/workflows/update-index.yml"
  workflow_dispatch:

permissions:
  contents: write

# Prevent multiple index-update workflows from running at the same time.
concurrency:
  group: update-blog-index
  cancel-in-progress: false

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate index.json
        run: python3 generate_index.py

      - name: Commit and push index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- index.json; then
            echo "index.json is already up to date."
            exit 0
          fi

          git add index.json
          git commit -m "chore: update blog index"

          # Rebase our generated commit on top of the latest main.
          git fetch origin main
          git rebase origin/main

          # Push the rebased commit.
          git push origin HEAD:main
