<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>test1 — Daily Blog</title>

    <meta
        name="description"
        content="hello world"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #080808;
            --surface: #101010;
            --border: rgba(255,255,255,.09);
            --text: #f5f5f5;
            --muted: #888;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at 50% -20%,
                    rgba(255,255,255,.08),
                    transparent 40%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            line-height: 1.7;
        }

        .container {
            width: min(
                760px,
                calc(100% - 32px)
            );

            margin: auto;
        }

        header {
            padding: 55px 0 35px;
            border-bottom: 1px solid var(--border);
        }

        .back {
            display: inline-block;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 35px;
        }

        .back:hover {
            color: var(--text);
        }

        .date {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: clamp(
                34px,
                7vw,
                58px
            );

            line-height: 1.05;
            letter-spacing: -2px;
        }

        .author {
            margin-top: 18px;
            color: var(--muted);
            font-size: 13px;
        }

        main {
            padding: 45px 0 90px;
        }

        article {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 30px;
        }

        article p {
            margin-bottom: 22px;
            color: #ddd;
            font-size: 16px;
        }

        article p:last-child {
            margin-bottom: 0;
        }

        footer {
            border-top: 1px solid var(--border);
            padding: 25px 0 40px;
            color: #555;
            font-size: 12px;
        }

        @media (max-width: 600px) {

            article {
                padding: 22px;
            }

            article p {
                font-size: 15px;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="container">

        <a
            class="back"
            href="../index.html"
        >
            ← Back to Daily Blog
        </a>

        <div class="date">
            September 04, 2026
            ·
            08:01 PM
        </div>

        <h1>
            test1
        </h1>

        <div class="author">
            Published by @yocrrz
        </div>

    </div>

</header>

<main>

    <div class="container">

        <article>

            <p>hello world</p>

        </article>

    </div>

</main>

<footer>

    <div class="container">

        YOCRRZ Daily Blog · vRSS

    </div>

</footer>

</body>

</html>
